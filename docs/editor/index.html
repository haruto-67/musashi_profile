---
sitemap: false
---
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>編集 — 長谷川武蔵 Drums</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>

<!-- ============ D-0. 入り口のパスワードゲート ============ -->
<div class="authGate" id="authGate">
  <h1>編集画面</h1>
  <form id="authForm">
    <input type="password" id="authPassword" placeholder="パスワード" autocomplete="off" required>
    <button type="submit" id="authSubmit">入る</button>
  </form>
  <p class="status" id="authStatus"></p>
  <p class="buildInfo" id="buildInfo">配信バージョンを確認中…</p>
</div>

<!-- ============ 編集画面本体（構造は index.html と同じ） ============ -->
<div id="editorRoot" hidden>

  <!-- ヘッダーの写真・肩書き・名前は編集対象外（固定）。表示のみ -->
  <header class="hero">
    <div class="shot img" id="heroShot" style="--src:url('../images/hero.jpg')"></div>
    <div class="in">
      <p class="role" id="roleText"></p>
      <h1 id="nameText"></h1>
      <p class="en" id="nameEnText"></p>
    </div>
  </header>

  <div class="wrap">

    <section>
      <div class="head foldHead" id="profileHead" role="button" tabindex="0" aria-expanded="false" aria-controls="profileBody"><h2>PROFILE</h2><span>自己紹介・条件・SNS・連絡先</span><span class="foldLabel">開く</span><span class="foldIcon">▸</span></div>
      <div class="foldBody" id="profileBody" hidden>
        <div class="intro">
          <p class="lede" id="ledeText" contenteditable="true" data-placeholder="自己紹介"></p>
          <div class="introText">
            <dl class="info">
              <div>
                <dt>活動地域について</dt>
                <dd id="areaText" contenteditable="true" data-placeholder="活動地域"></dd>
              </div>
              <div>
                <dt>機材について</dt>
                <dd id="gearText" contenteditable="true" data-placeholder="機材"></dd>
              </div>
            </dl>
            <dl class="info">
              <div>
                <dt>日程について</dt>
                <dd id="scheduleText" contenteditable="true" data-placeholder="日程について"></dd>
              </div>
              <div>
                <dt>報酬について</dt>
                <dd id="feeText" contenteditable="true" data-placeholder="報酬について"></dd>
              </div>
            </dl>
          </div>
          <div class="portrait img imgEdit" id="portraitImg" data-kind="portrait" style="--src:url('../images/portrait.jpg')">
            <div class="editOverlay">変更</div>
            <input type="file" accept="image/*">
          </div>
          <div id="snsEditor"></div>
          <p class="meta">連絡先 <b id="emailText" contenteditable="true" data-placeholder="メールアドレス"></b></p>
        </div>
      </div>
    </section>

    <section>
      <div class="head foldHead" id="bandsHead" role="button" tabindex="0" aria-expanded="false" aria-controls="bandsBody"><h2>BANDS</h2><span>メンバーとして在籍</span><span class="foldLabel">開く</span><span class="foldIcon">▸</span></div>
      <div class="foldBody" id="bandsBody" hidden>
        <div id="bandsEditor"></div>
        <button type="button" class="addRowBtn" id="addBandBtn">＋ バンドを追加</button>

        <div class="strip img imgEdit" id="stripImg" data-kind="strip" style="--src:url('../images/live-wide.jpg')">
          <div class="editOverlay">変更</div>
          <input type="file" accept="image/*">
        </div>
      </div>
    </section>

    <section>
      <div class="head foldHead" id="supportHead" role="button" tabindex="0" aria-expanded="false" aria-controls="supportBody"><h2>SUPPORT</h2><span>サポートで参加</span><span class="foldLabel">開く</span><span class="foldIcon">▸</span></div>
      <div class="foldBody" id="supportBody" hidden>
        <div id="supportEditor"></div>
        <button type="button" class="addRowBtn" id="addSupportBtn">＋ 行を追加</button>
      </div>
    </section>

    <section>
      <div class="head foldHead" id="gigsHead" role="button" tabindex="0" aria-expanded="false" aria-controls="gigsBody"><h2>SCHEDULE</h2><span>これから3ヶ月のライブ</span><span class="foldLabel">開く</span><span class="foldIcon">▸</span></div>
      <div class="foldBody" id="gigsBody" hidden>
        <div class="calnav" id="gigsMonthNav"></div>
        <div id="gigsEditor"></div>
        <button type="button" class="addRowBtn" id="addGigBtn">＋ ライブを追加</button>
      </div>
    </section>

    <footer>
      <p class="word" id="wordText" contenteditable="true" data-placeholder="フッターのひとこと"></p>
      <p class="fine">このページは検索エンジンに登録していません。</p>
    </footer>

  </div>
</div>

<!-- ============ D-6. 確定バー（パスワードは入り口で入力済みのものをメモリ上で使い回す） ============ -->
<div class="editorBar" id="editorBar" hidden>
  <button type="button" id="publishBtn">確定</button>
  <p class="editorStatus" id="editorStatus" hidden></p>
</div>

<script src="../render.js"></script>
<script src="editor.js"></script>
</body>
</html>
